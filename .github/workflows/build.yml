name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you uploaded the project as a .zip, this unpacks it so the build can find it.
      - name: Unzip any zip files in the repo
        shell: bash
        run: |
          n=0
          find . -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
            n=$((n+1))
            echo "Unzipping: $z"
            unzip -oq "$z" -d "$(dirname "$z")/unzipped_$n" || echo "Could not unzip $z (skipping)"
          done

      - name: Find the mod folder (the one containing settings.gradle)
        id: find
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No settings.gradle found anywhere in the repo. Files present:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Mod folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # Minecraft 26.1 requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The newest Loom 1.18 builds require Gradle 9.7.0.
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gameadmin-26.1-fabric
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
